<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>순천 버스 노선 가이드</title>
<style>
:root{
  --bg-body:#101318;--bg-header:#191d24;--bg-card:#1e232b;--bg-input:#262c36;--bg-stop:#2a303c;
  --text-main:#f2f4f6;--text-sub:#b0b8c1;--text-muted:#76808f;--border-color:#2f3642;
  --primary:#4593fc;--primary-light:#1e324d;--primary-text:#74b2ff;
  --shadow:0 2px 10px rgba(0,0,0,.45);--card-shadow:0 2px 6px rgba(0,0,0,.28);
  --origin-bg:#0c382c;--origin-text:#63e6be;--origin-border:#12b886;
  --end-bg:#133252;--end-text:#74c0fc;--end-border:#339af0;
  --imp-bg:#45181c;--imp-text:#ff8787;--imp-border:#fa5252;
  --time-bg:#2b2615;--time-text:#ffd43b;--time-border:#fcc419;
  --dep-bg:#133829;--dep-text:#69db7c;--dep-border:#2f9e44;
  --x-bg:#2c2f36;--x-text:#adb5bd;--x-border:#495057;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
body{background-color:var(--bg-body);color:var(--text-main);padding-bottom:48px}
.header{position:sticky;top:0;background:var(--bg-header);padding:12px 16px 10px;box-shadow:var(--shadow);z-index:100;border-bottom:1px solid var(--border-color)}
.header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.header h1{font-size:18px;font-weight:900;color:var(--text-main);letter-spacing:-.3px}
.header-actions{display:flex;align-items:center;gap:6px}
.sub-badge{font-size:11.5px;background:var(--primary-light);color:var(--primary-text);padding:4px 9px;border-radius:12px;font-weight:800}
.backup-btn{font-size:11.5px;background:var(--bg-stop);color:var(--text-sub);border:1px solid var(--border-color);padding:4px 9px;border-radius:10px;font-weight:700;cursor:pointer}
.backup-btn:active{background:var(--primary);color:#fff}

/* 2단 메인 메뉴 */
.main-menu{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg-stop);padding:4px;border-radius:12px;margin-bottom:10px}
.menu-btn{padding:9px 0;border:none;border-radius:9px;background:transparent;color:var(--text-sub);font-size:14.5px;font-weight:800;cursor:pointer;transition:.15s}
.menu-btn.active{background:var(--bg-card);color:var(--primary);box-shadow:0 1px 4px rgba(0,0,0,.35)}

.search-box{position:relative;display:flex;align-items:center}
.search-box input{width:100%;padding:10px 38px 10px 14px;font-size:16px;border:2px solid var(--primary);border-radius:12px;outline:none;background:var(--bg-input);color:var(--text-main)}
.search-box input::placeholder{color:var(--text-muted);font-size:14px}
.clear-btn{position:absolute;right:10px;background:var(--text-muted);color:var(--bg-header);border:none;border-radius:50%;width:22px;height:22px;font-size:13px;font-weight:800;cursor:pointer;display:none;align-items:center;justify-content:center}

.tabs{display:flex;gap:6px;overflow-x:auto;padding-top:9px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:6px 12px;border-radius:20px;border:1px solid var(--border-color);background:var(--bg-card);font-size:13px;font-weight:700;color:var(--text-sub);white-space:nowrap;cursor:pointer}
.tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}

.quick-nums{display:flex;gap:6px;overflow-x:auto;padding-top:8px;margin-top:8px;border-top:1px dashed var(--border-color);scrollbar-width:none}
.quick-nums::-webkit-scrollbar{display:none}
.q-btn{padding:5px 11px;border-radius:8px;border:1px solid var(--border-color);background:var(--bg-stop);color:var(--text-main);font-size:14px;font-weight:800;white-space:nowrap;cursor:pointer}
.q-btn.active{background:#ff922b;color:#111;border-color:#ff922b}
.q-btn.is-x{color:var(--text-muted);border-style:dashed}
.q-btn.is-pinned{border-color:#fcc419;color:#ffd43b}

.container{padding:14px 16px;max-width:640px;margin:0 auto}

/* 정렬 & 직통만 보기 컨트롤 바 */
.control-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.ctrl-group{display:flex;gap:6px;align-items:center}
.ctrl-btn{padding:5px 10px;border-radius:8px;border:1px solid var(--border-color);background:var(--bg-card);color:var(--text-sub);font-size:12.5px;font-weight:800;cursor:pointer}
.ctrl-btn.active{background:var(--primary-light);color:var(--primary-text);border-color:var(--primary)}
.ctrl-btn.toggle-on{background:#2b2615;color:#ffd43b;border-color:#fcc419}

.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--text-sub);margin-bottom:10px;align-items:center}
.legend-item{display:flex;align-items:center;gap:4px;font-weight:600}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block}
.dot.time{background:var(--time-border)}
.dot.dep{background:var(--dep-border)}
.dot.origin{background:var(--origin-border)}
.dot.end{background:var(--end-border)}
.dot.imp{background:var(--imp-border)}

.filter-banner{display:flex;justify-content:space-between;align-items:center;background:var(--primary-light);border:1px solid var(--primary);color:var(--primary-text);padding:8px 12px;border-radius:10px;margin-bottom:10px;font-size:13px;font-weight:800}
.filter-banner button{background:var(--primary);color:#fff;border:none;padding:3px 9px;border-radius:6px;font-size:12px;font-weight:800;cursor:pointer}

.count{font-size:12.5px;color:var(--text-muted);margin-bottom:10px;font-weight:600}

.card{background:var(--bg-card);border-radius:14px;padding:15px;margin-bottom:12px;box-shadow:var(--card-shadow);border:1px solid var(--border-color);position:relative}
.card.card-x{opacity:.82}
.card.card-pinned{border:1.5px solid #fcc419;box-shadow:0 3px 12px rgba(252,196,25,.12)}

/* 카드 상단 헤더: 번호 + 방면 + 시간 뱃지 + 핀 버튼 */
.card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border-color)}
.title-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px;flex:1;min-width:0}
.bus-num{font-size:21px;font-weight:900;color:var(--primary);letter-spacing:-.5px;white-space:nowrap}
.dest-title{font-size:14.5px;font-weight:800;color:var(--text-main);word-break:keep-all}
.inline-times{display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:2px}
.time-chip{font-size:12px;font-weight:800;padding:3px 7px;border-radius:6px;background:var(--time-bg);color:var(--time-text);border:1px solid var(--time-border);white-space:nowrap}
.time-chip.dur{background:var(--bg-stop);color:var(--text-main);border:1px solid var(--border-color)}
.time-chip.dep{background:var(--dep-bg);color:var(--dep-text);border:1px solid var(--dep-border)}
.time-chip.no-direct{background:var(--x-bg);color:var(--x-text);border:1px solid var(--x-border)}

.right-actions{display:flex;align-items:center;gap:5px;flex-shrink:0}
.pin-btn{padding:4px 8px;border-radius:7px;border:1px solid var(--border-color);background:var(--bg-stop);color:var(--text-sub);font-size:11.5px;font-weight:800;cursor:pointer;white-space:nowrap}
.pin-btn.pinned{background:#3b3214;color:#ffd43b;border-color:#fcc419}

.route-flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14px;line-height:1.5;color:var(--text-main)}
.stop{background:var(--bg-stop);padding:5px 9px;border-radius:7px;font-weight:600;border:1px solid transparent;cursor:pointer;transition:transform .1s}
.stop:active{transform:scale(.96)}
.stop.origin{background:var(--origin-bg);color:var(--origin-text);border:1.5px solid var(--origin-border);font-weight:800}
.stop.end{background:var(--end-bg);color:var(--end-text);border:1.5px solid var(--end-border);font-weight:800}
.stop.important{background:var(--imp-bg);color:var(--imp-text);border:1.5px solid var(--imp-border);font-weight:800}
.badge-tag{font-size:10px;padding:1px 4px;border-radius:4px;margin-right:4px;vertical-align:middle;font-weight:900}
.origin .badge-tag{background:var(--origin-border);color:#000}
.end .badge-tag{background:var(--end-border);color:#000}

/* 좌/우 회전 컬러 뱃지 */
.turn-badge{font-size:11px;padding:1px 5px;border-radius:4px;margin-left:4px;font-weight:900;vertical-align:middle}
.turn-left{background:#1971c2;color:#fff}
.turn-right{background:#e8590c;color:#fff}

.stop.highlight{background:#ffd43b!important;font-weight:900!important;color:#111!important;border:1.5px solid #f59f00!important}
.arrow{color:var(--text-muted);font-size:11px;font-weight:700}

.note{margin-top:11px;padding:8px 11px;background:var(--imp-bg);color:var(--imp-text);border:1px solid var(--imp-border);border-radius:8px;font-size:13px;font-weight:700;line-height:1.45}

/* 개인 현장 메모 영역 */
.user-memo-box{margin-top:9px;padding-top:9px;border-top:1px dashed var(--border-color)}
.user-memo-text{background:#182232;border:1px solid #2b4366;color:#a5d8ff;padding:8px 10px;border-radius:8px;font-size:13px;font-weight:600;line-height:1.45;margin-bottom:6px;white-space:pre-wrap}
.memo-edit-btn{background:transparent;border:1px solid var(--border-color);color:var(--text-sub);padding:4px 9px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer}
.memo-edit-btn:active{background:var(--bg-stop)}
.memo-editor{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.memo-editor textarea{width:100%;background:var(--bg-input);color:var(--text-main);border:1.5px solid var(--primary);border-radius:8px;padding:8px;font-size:13.5px;min-height:64px;resize:vertical;outline:none}
.memo-editor-btns{display:flex;gap:6px;justify-content:flex-end}
.memo-save{background:var(--primary);color:#fff;border:none;padding:5px 12px;border-radius:6px;font-size:12.5px;font-weight:800;cursor:pointer}
.memo-cancel{background:var(--bg-stop);color:var(--text-sub);border:none;padding:5px 10px;border-radius:6px;font-size:12.5px;font-weight:700;cursor:pointer}

/* 모달 (메모 백업/복원) */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:200}
.modal{background:var(--bg-card);border:1px solid var(--border-color);border-radius:16px;padding:18px;width:100%;max-width:460px;box-shadow:var(--shadow)}
.modal h3{font-size:16px;font-weight:900;margin-bottom:6px}
.modal p{font-size:12.5px;color:var(--text-sub);margin-bottom:10px;line-height:1.5}
.modal textarea{width:100%;height:130px;background:var(--bg-input);color:var(--text-main);border:1px solid var(--border-color);border-radius:10px;padding:10px;font-size:12.5px;margin-bottom:10px;outline:none}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.modal-btns button{padding:7px 12px;border-radius:8px;border:none;font-size:13px;font-weight:800;cursor:pointer}
.btn-copy{background:#2f9e44;color:#fff}
.btn-restore{background:var(--primary);color:#fff}
.btn-close{background:var(--bg-stop);color:var(--text-sub)}

/* 2. 버스노선 준비 화면 */
.empty-box{background:var(--bg-card);border:1.5px dashed var(--border-color);border-radius:16px;padding:36px 20px;text-align:center;margin-top:10px}
.empty-box h2{font-size:17px;font-weight:800;margin-bottom:8px;color:var(--text-main)}
.empty-box p{font-size:13.5px;color:var(--text-sub);line-height:1.6}
.hidden{display:none!important}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <h1>🚌 순천 버스 노선 가이드</h1>
    <div class="header-actions">
      <button class="backup-btn" id="openBackupBtn">💾 메모 백업</button>
      <span class="sub-badge">순천교통 기준</span>
    </div>
  </div>
  
  <div class="main-menu">
    <button class="menu-btn active" id="btnMenuDirect">1. 직통</button>
    <button class="menu-btn" id="btnMenuNormal">2. 버스노선</button>
  </div>

  <div id="directControls">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="번호, 방면, 경유지, 초성(예: ㅅㅍ, ㅇㅊ) 검색" autocomplete="off" />
      <button class="clear-btn" id="clearBtn">✕</button>
    </div>
    <div class="tabs" id="tabContainer">
      <button class="tab active" data-group="ALL">전체</button>
      <button class="tab" data-group="20번대">20번대</button>
      <button class="tab" data-group="50번대">50번대</button>
      <button class="tab" data-group="60번대">60번대</button>
      <button class="tab" data-group="70번대">70번대</button>
      <button class="tab" data-group="80번대">80번대</button>
      <button class="tab" data-group="90번대">90번대</button>
      <button class="tab" data-group="100번대">100번대</button>
    </div>
    <div class="quick-nums" id="quickNums"></div>
  </div>
</div>

<!-- 1. 직통 화면 -->
<div class="container" id="viewDirect">
  <div class="control-bar">
    <div class="ctrl-group">
      <button class="ctrl-btn active" id="sortNumBtn">번호순</button>
      <button class="ctrl-btn" id="sortTimeBtn">⏰ 출발시간순</button>
    </div>
    <div class="ctrl-group">
      <button class="ctrl-btn" id="onlyDirectBtn">직통만 보기 (X제외)</button>
    </div>
  </div>

  <div class="legend">
    <span class="legend-item"><i class="dot time"></i>직통발</span>
    <span class="legend-item"><i class="dot dep"></i>차고지 출차권장</span>
    <span class="legend-item"><i class="dot origin"></i>기점</span>
    <span class="legend-item"><i class="dot end"></i>종점</span>
    <span class="legend-item"><i class="dot imp"></i>주의·분기</span>
  </div>

  <div id="stopFilterBanner" class="filter-banner hidden">
    <span id="stopFilterText">정류장 필터 적용됨</span>
    <button id="clearStopFilter">해제 ✕</button>
  </div>

  <div class="count" id="resultCount">총 0개 노선</div>
  <div id="routeList"></div>
</div>

<!-- 2. 버스노선 화면 (추후 일반 노선 데이터 추가 공간) -->
<div class="container hidden" id="viewNormal">
  <div class="empty-box">
    <h2>📋 일반 버스노선 정리 공간</h2>
    <p>추후 정리해 주실 순천시 일반 버스노선 데이터가<br/>이 탭에 깔끔하게 추가될 예정입니다.</p>
  </div>
</div>

<!-- 메모 백업/복원 모달 -->
<div class="modal-backdrop hidden" id="backupModal">
  <div class="modal">
    <h3>💾 현장 메모 백업 및 복원</h3>
    <p>아래 텍스트를 복사해서 카카오톡 '나와의 채팅'에 저장해 두시면 기기 변경 시에도 그대로 복원할 수 있습니다.</p>
    <textarea id="backupTextarea" placeholder="저장된 메모 데이터가 여기에 표시됩니다."></textarea>
    <div class="modal-btns">
      <button class="btn-copy" id="copyBackupBtn">전체 복사</button>
      <button class="btn-restore" id="restoreBackupBtn">붙여넣은 내용 복원</button>
      <button class="btn-close" id="closeBackupBtn">닫기</button>
    </div>
  </div>
</div>

<script>
const directRoutes = [
  {
    num: "23", group: "20번대", dest: "광양세풍",
    directTime: "X", durationMin: null, note: "",
    stops: [{ name: "광양세풍" }]
  },
  {

    stops: [
      { name: "제일고" }, { name: "선평삼거리" }, { name: "상비교차로(성가롤로)" },

      { name: "왜성(정류장) [우]" }
    ]
  },
  {
    num: "52", group: "50번대", dest: "청암대",
    directTime: "6:05", durationMin: 25, note: "",
    stops: [{ name: "제일고" }, { name: "청암대" }]
  },
  {

    stops: [
      { name: "제일고" }, { name: "선평삼거리" }, { name: "왕지IC 램프F교" },
      { name: "NC백화점 사거리 [좌]" }, { name: "범암교(왕운세차장) [좌]" }, { name: "대동(왕조가든)" }

    stops: [
      { name: "제일고" }, { name: "용당 삼산로 방면 [좌](원용당교)" }, { name: "용당 신흥길 방면" },
      { name: "봉화터널" }, { name: "한듬정육점 측 [좌]" }, { name: "봉화그린빌" }, { name: "조례대림A 방면" }
    ]
  },
  {

    directTime: "6:15", durationMin: 15, note: "",

  },
  {

    directTime: "6:40", durationMin: 25, note: "",
    stops: [
      { name: "제일고" }, { name: "선평삼거리" }, { name: "학구삼거리" },
      { name: "서평교차로(승주읍사거리)" }, { name: "쌍암기사식당" }, { name: "서동마을" }
    ]
  },
  {
    num: "61", group: "60번대", dest: "낙안읍성(흥림,평사경유)",
    directTime: "6:50", durationMin: 45, note: "비고: 옥산(신규),평사마을,흥림경유",
    stops: [
      { name: "제일고" }, { name: "가곡삼거리" }, { name: "강변고가교(로터리까지)" },
      { name: "청암대(박람회 서문측으로)" }, { name: "연동삼거리" }, { name: "낙안읍성(주차장)" }
    ]
  },
  {
    num: "62", group: "60번대", dest: "상사기동(초곡,운곡,면사무소경유)",
    directTime: "6:10", durationMin: 35, note: "비고: 초곡마을 출발",
    stops: [
      { name: "제일고" }, { name: "가곡삼거리" }, { name: "강변고가교(로터리까지)" },
      { name: "청암대(박람회 서문측으로)" }, { name: "연동삼거리" }, { name: "초곡마을입구" }, { name: "초곡마을" }
    ]
  },

// 시간 계산 유틸리티 (직통발 시각 - 소요시간 ±5분 = 차고지 출차 권장 시각)
function parseMinutes(timeStr) {
  if (!timeStr || timeStr === "X" || !timeStr.includes(":")) return null;
  const [h, m] = timeStr.split(":").map(Number);
  return h * 60 + m;
}
function formatHHMM(totalMin) {
  const m = ((totalMin % 1440) + 1440) % 1440;
  const hh = String(Math.floor(m / 60)).padStart(2, "0");
  const mm = String(m % 60).padStart(2, "0");
  return `${hh}:${mm}`;
}
function getGarageDepartRange(directTime, durationMin) {
  const base = parseMinutes(directTime);
  if (base === null || !durationMin) return null;
  const early = formatHHMM(base - durationMin - 5);
  const late = formatHHMM(base - durationMin + 5);
  return `${early}~${late}`;
}

// [좌], [우] 컬러 뱃지 변환
function formatStopName(name) {
  return name
    .replace(/\[좌\]/g, '<span class="turn-badge turn-left">좌</span>')
    .replace(/\[우\]/g, '<span class="turn-badge turn-right">우</span>');
}

// 초성 추출 함수
const CHO = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
function getChosung(str) {
  let res = "";
  for (let i = 0; i < str.length; i++) {
    const code = str.charCodeAt(i) - 44032;
    if (code >= 0 && code <= 11171) res += CHO[Math.floor(code / 588)];
    else res += str[i];
  }
  return res;
}

function matchQuery(target, query) {
  if (!query) return true;
  const t = target.toLowerCase();
  const q = query.toLowerCase();
  if (t.includes(q)) return true;
  if (/^[ㄱ-ㅎ\s]+$/.test(q)) {
    return getChosung(t).includes(q.replace(/\s+/g, ""));
  }
  return false;
}

function renderQuickButtons() {
  const list = directRoutes.filter(r => {
    const groupOk = currentGroup === "ALL" || r.group === currentGroup;
    const directOk = !onlyDirect || r.directTime !== "X";
    return groupOk && directOk;
  });

  quickNumsContainer.innerHTML = list.map(r => {
    const isPinned = pinnedNums.includes(r.num);
    return `
      <button class="q-btn ${selectedQuickNum === r.num ? "active" : ""} ${r.directTime === "X" ? "is-x" : ""} ${isPinned ? "is-pinned" : ""}" data-num="${r.num}">
        ${isPinned ? "📌" : ""}${r.num}${r.directTime === "X" ? "(X)" : ""}
      </button>
    `;
  }).join("");

  document.querySelectorAll(".q-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const n = btn.dataset.num;
      selectedStopFilter = null;
      if (selectedQuickNum === n) selectedQuickNum = null;
      else { searchInput.value = ""; selectedQuickNum = n; }
      renderQuickButtons();
      render();
    });
  });
}

function render() {
  const q = searchInput.value.trim();
  clearBtn.style.display = q ? "flex" : "none";

  if (selectedStopFilter) {
    stopFilterBanner.classList.remove("hidden");
    stopFilterText.textContent = `📍 '${selectedStopFilter}' 경유 노선 모아보기`;
  } else {
    stopFilterBanner.classList.add("hidden");
  }

  let filtered = directRoutes.filter(r => {
    const groupOk = currentGroup === "ALL" || r.group === currentGroup;
    if (!groupOk) return false;
    if (onlyDirect && r.directTime === "X") return false;
    if (selectedQuickNum) return r.num === selectedQuickNum;
    if (selectedStopFilter) return r.stops.some(s => s.name.includes(selectedStopFilter));
    if (!q) return true;
    const memo = userMemos[r.num] || "";
    return (
      matchQuery(r.num, q) ||
      matchQuery(r.dest, q) ||
      matchQuery(r.directTime, q) ||
      matchQuery(r.note, q) ||
      matchQuery(memo, q) ||
      r.stops.some(s => matchQuery(s.name, q))
    );
  });

  // 정렬 (핀 고정 최우선 -> 번호순 또는 출발시간순)
  filtered.sort((a, b) => {
    const pinA = pinnedNums.includes(a.num) ? 0 : 1;
    const pinB = pinnedNums.includes(b.num) ? 0 : 1;
    if (pinA !== pinB) return pinA - pinB;

    if (sortMode === "TIME") {
      const tA = parseMinutes(a.directTime) ?? 99999;
      const tB = parseMinutes(b.directTime) ?? 99999;
      if (tA !== tB) return tA - tB;
    }
    return 0; // 기본 배열 순서(번호순) 유지
  });

  if (selectedQuickNum) {
    resultCount.textContent = `${selectedQuickNum}번 노선 선택됨 (버튼 재터치 시 전체보기)`;
  } else {
    resultCount.textContent = `표시 노선: ${filtered.length}개 (고정 ${pinnedNums.length}개)`;
  }

  routeList.innerHTML = "";
  filtered.forEach(r => {
    const isX = r.directTime === "X";
    const isPinned = pinnedNums.includes(r.num);
    const card = document.createElement("div");
    card.className = `card ${isX ? "card-x" : ""} ${isPinned ? "card-pinned" : ""}`;

    const depRange = getGarageDepartRange(r.directTime, r.durationMin);
    const timeHtml = isX
      ? `<span class="time-chip no-direct">직통발: X</span>`
      : `<span class="time-chip">⏰ 직통발 ${r.directTime}</span>
         <span class="time-chip dur">약 ${r.durationMin}분 (±5분)</span>
         <span class="time-chip dep">🚌 출차 ${depRange}</span>`;

    const stopsHtml = r.stops.map((s, idx) => {
      const isFirst = idx === 0 && r.stops.length > 1;
      const isLast = idx === r.stops.length - 1;
      const isMatch = (q && matchQuery(s.name, q)) || (selectedStopFilter && s.name.includes(selectedStopFilter));

      let cls = "", tag = "";
      if (isFirst) {
        cls = "origin";
        tag = '<span class="badge-tag">기점</span>';
      } else if (isLast) {
        cls = "end";
        tag = '<span class="badge-tag">직통발</span>';
      } else if (s.important) {
        cls = "important";
      }

      const cleanStopName = s.name.split("(")[0].split("[")[0].trim();
      return `<span class="stop ${cls} ${isMatch ? "highlight" : ""}" data-stop="${cleanStopName}">${tag}${formatStopName(s.name)}</span>${idx === r.stops.length - 1 ? "" : '<span class="arrow">▶</span>'}`;
    }).join("");

    const noteHtml = r.note ? `<div class="note">📌 ${r.note}</div>` : "";
    const savedMemo = userMemos[r.num] || "";
    const isEditing = editingMemoNum === r.num;

    const memoSectionHtml = isEditing
      ? `<div class="user-memo-box">
           <div class="memo-editor">
             <textarea id="memoInput_${r.num}" placeholder="예: 왕지IC 지나서 1차선 미리 타기, 회차지 골목 주의">${savedMemo}</textarea>
             <div class="memo-editor-btns">
               <button class="memo-cancel" data-cancel="${r.num}">취소</button>
               <button class="memo-save" data-save="${r.num}">저장</button>
             </div>
           </div>
         </div>`
      : `<div class="user-memo-box">
           ${savedMemo ? `<div class="user-memo-text">📝 ${savedMemo}</div>` : ""}
           <button class="memo-edit-btn" data-edit="${r.num}">${savedMemo ? "✏️ 내 메모 수정" : "+ 내 현장 메모 추가"}</button>
         </div>`;

    card.innerHTML = `
      <div class="card-header">
        <div class="title-wrap">
          <span class="bus-num">${r.num}번</span>
          <span class="dest-title">${r.dest}</span>
          <span class="inline-times">${timeHtml}</span>
        </div>
        <div class="right-actions">
          <button class="pin-btn ${isPinned ? "pinned" : ""}" data-pin="${r.num}">${isPinned ? "📌 고정됨" : "📌 고정"}</button>
        </div>
      </div>
      <div class="route-flow">${stopsHtml}</div>
      ${noteHtml}
      ${memoSectionHtml}
    `;
    routeList.appendChild(card);
  });

  // 정류장 칩 클릭 시 해당 정류장 경유 노선 필터링
  document.querySelectorAll(".stop").forEach(el => {
    el.addEventListener("click", () => {
      const st = el.dataset.stop;
      if (!st) return;
      selectedQuickNum = null;
      searchInput.value = "";
      selectedStopFilter = selectedStopFilter === st ? null : st;
      renderQuickButtons();
      render();
    });
  });

  // 오늘 배차 핀 고정 토글
  document.querySelectorAll(".pin-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const n = btn.dataset.pin;
      if (pinnedNums.includes(n)) pinnedNums = pinnedNums.filter(x => x !== n);
      else pinnedNums.push(n);
      savePins();
      renderQuickButtons();
      render();
    });
  });

  // 현장 메모 편집/저장/취소
  document.querySelectorAll("[data-edit]").forEach(btn => {
    btn.addEventListener("click", () => {
      editingMemoNum = btn.dataset.edit;
      render();
      const ta = document.getElementById(`memoInput_${editingMemoNum}`);
      if (ta) ta.focus();
    });
  });
  document.querySelectorAll("[data-cancel]").forEach(btn => {
    btn.addEventListener("click", () => {
      editingMemoNum = null;
      render();
    });
  });
  document.querySelectorAll("[data-save]").forEach(btn => {
    btn.addEventListener("click", () => {
      const n = btn.dataset.save;
      const ta = document.getElementById(`memoInput_${n}`);
      const val = ta ? ta.value.trim() : "";
      if (val) userMemos[n] = val;
      else delete userMemos[n];
      saveMemos();
      editingMemoNum = null;
      render();
    });
  });
}

// 메모 백업/복원 모달 로직
const backupModal = document.getElementById("backupModal"),
      backupTextarea = document.getElementById("backupTextarea");

document.getElementById("openBackupBtn").addEventListener("click", () => {
  backupTextarea.value = JSON.stringify({ pins: pinnedNums, memos: userMemos }, null, 2);
  backupModal.classList.remove("hidden");
});
document.getElementById("closeBackupBtn").addEventListener("click", () => {
  backupModal.classList.add("hidden");
});
document.getElementById("copyBackupBtn").addEventListener("click", () => {
  backupTextarea.select();
  navigator.clipboard?.writeText(backupTextarea.value);
  alert("메모 백업 데이터가 복사되었습니다! 카톡 '나와의 채팅' 등에 붙여넣어 보관하세요.");
});
document.getElementById("restoreBackupBtn").addEventListener("click", () => {
  try {
    const parsed = JSON.parse(backupTextarea.value);
    if (parsed.pins) { pinnedNums = parsed.pins; savePins(); }
    if (parsed.memos) { userMemos = parsed.memos; saveMemos(); }
    renderQuickButtons();
    render();
    backupModal.classList.add("hidden");
    alert("메모와 고정 배차 설정이 성공적으로 복원되었습니다!");
  } catch (e) {
    alert("올바른 백업 데이터 형식이 아닙니다. 복사해 둔 전체 텍스트를 그대로 붙여넣어 주세요.");
  }
});

clearStopFilter.addEventListener("click", () => {
  selectedStopFilter = null;
  render();
});
searchInput.addEventListener("input", () => {
  selectedQuickNum = null;
  selectedStopFilter = null;
  renderQuickButtons();
  render();
});
clearBtn.addEventListener("click", () => {
  searchInput.value = "";
  searchInput.focus();
  render();
});
tabs.forEach(tab => {
  tab.addEventListener("click", () => {
    tabs.forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    currentGroup = tab.dataset.group;
    selectedQuickNum = null;
    selectedStopFilter = null;
    renderQuickButtons();
    render();
  });
});

renderQuickButtons();
render();
</script>
</body>
</html>
