<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>순천 직통 노선 가이드</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --bg-body:#f2f4f7;--bg-header:#fff;--bg-card:#fff;--bg-input:#f9fafb;--bg-stop:#f2f4f6;
  --text-main:#191f28;--text-sub:#4e5968;--text-muted:#8b95a1;--border-color:#e5e8eb;
  --primary:#3182f6;--primary-light:#e8f3ff;--primary-text:#1b64da;
  --shadow:0 2px 8px rgba(0,0,0,.06);--card-shadow:0 1px 4px rgba(0,0,0,.04);
  --origin-bg:#e6fcf5;--origin-text:#087f5b;--origin-border:#63e6be;
  --end-bg:#e7f5ff;--end-text:#1864ab;--end-border:#4dabf7;
  --imp-bg:#fff0f0;--imp-text:#c92a2a;--imp-border:#ffa8a8;
}
body.dark{
  --bg-body:#101318;--bg-header:#191d24;--bg-card:#1e232b;--bg-input:#262c36;--bg-stop:#2a303c;
  --text-main:#f2f4f6;--text-sub:#b0b8c1;--text-muted:#76808f;--border-color:#2f3642;
  --primary:#4593fc;--primary-light:#1e324d;--primary-text:#74b2ff;
  --shadow:0 2px 10px rgba(0,0,0,.4);--card-shadow:0 2px 6px rgba(0,0,0,.25);
  --origin-bg:#0c382c;--origin-text:#63e6be;--origin-border:#12b886;
  --end-bg:#133252;--end-text:#74c0fc;--end-border:#339af0;
  --imp-bg:#45181c;--imp-text:#ff8787;--imp-border:#fa5252;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
body{background-color:var(--bg-body);color:var(--text-main);padding-bottom:30px;transition:background-color .2s,color .2s}
.header{position:sticky;top:0;background:var(--bg-header);padding:12px 16px 10px;box-shadow:var(--shadow);z-index:1000;border-bottom:1px solid var(--border-color)}
.header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.header h1{font-size:18px;font-weight:800;color:var(--text-main)}
.dark-toggle{background:var(--bg-stop);color:var(--text-main);border:1px solid var(--border-color);padding:6px 12px;border-radius:20px;font-size:13px;font-weight:700;cursor:pointer}

.mode-switch{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg-stop);padding:4px;border-radius:12px;margin-bottom:8px}
.mode-btn{padding:8px 0;border:none;border-radius:9px;background:transparent;color:var(--text-sub);font-size:14px;font-weight:800;cursor:pointer;transition:.15s}
.mode-btn.active{background:var(--bg-card);color:var(--primary);box-shadow:0 1px 3px rgba(0,0,0,.12)}

.search-box{position:relative;display:flex;align-items:center}
.search-box input{width:100%;padding:10px 38px 10px 14px;font-size:16px;border:2px solid var(--primary);border-radius:12px;outline:none;background:var(--bg-input);color:var(--text-main)}
.search-box input::placeholder{color:var(--text-muted)}
.clear-btn{position:absolute;right:10px;background:var(--text-muted);color:var(--bg-header);border:none;border-radius:50%;width:22px;height:22px;font-size:13px;font-weight:700;cursor:pointer;display:none;align-items:center;justify-content:center}

.tabs{display:flex;gap:6px;overflow-x:auto;padding-top:8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:6px 12px;border-radius:20px;border:1px solid var(--border-color);background:var(--bg-card);font-size:13px;font-weight:700;color:var(--text-sub);white-space:nowrap;cursor:pointer}
.tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}

.quick-nums{display:flex;gap:6px;overflow-x:auto;padding-top:8px;margin-top:8px;border-top:1px dashed var(--border-color);scrollbar-width:none}
.quick-nums::-webkit-scrollbar{display:none}
.q-btn{padding:5px 11px;border-radius:8px;border:1px solid var(--border-color);background:var(--bg-stop);color:var(--text-main);font-size:14px;font-weight:800;white-space:nowrap;cursor:pointer}
.q-btn.active{background:#ff922b;color:#fff;border-color:#ff922b}

.container{padding:14px 16px;max-width:680px;margin:0 auto}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--text-sub);margin-bottom:10px;align-items:center}
.legend-item{display:flex;align-items:center;gap:4px;font-weight:600}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.dot.origin{background:var(--origin-border)}
.dot.end{background:var(--end-border)}
.dot.imp{background:var(--imp-border)}
.count{font-size:13px;color:var(--text-muted);margin-bottom:10px;font-weight:600}

.card{background:var(--bg-card);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:var(--card-shadow);border:1px solid var(--border-color)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.bus-num{font-size:22px;font-weight:900;color:var(--primary);letter-spacing:-.5px}
.group-badge{font-size:12px;background:var(--primary-light);color:var(--primary-text);padding:4px 8px;border-radius:6px;font-weight:700}
.route-flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14.5px;line-height:1.5;color:var(--text-main)}
.stop{background:var(--bg-stop);padding:5px 9px;border-radius:7px;font-weight:500;border:1px solid transparent}
.stop.origin{background:var(--origin-bg);color:var(--origin-text);border:1.5px solid var(--origin-border);font-weight:800}
.stop.end{background:var(--end-bg);color:var(--end-text);border:1.5px solid var(--end-border);font-weight:800}
.stop.important{background:var(--imp-bg);color:var(--imp-text);border:1.5px solid var(--imp-border);font-weight:800}
.badge-tag{font-size:10px;padding:1px 4px;border-radius:4px;margin-right:4px;vertical-align:middle;font-weight:900}
.origin .badge-tag{background:var(--origin-border);color:#000}
.end .badge-tag{background:var(--end-border);color:#000}
.stop.highlight{background:#ffd43b!important;font-weight:900!important;color:#111!important;border:1.5px solid #f59f00!important}
.arrow{color:var(--text-muted);font-size:11px;font-weight:700}
.note{margin-top:12px;padding:9px 11px;background:var(--imp-bg);color:var(--imp-text);border:1px solid var(--imp-border);border-radius:8px;font-size:13.5px;font-weight:700}

/* 실제 지도 화면 스타일 */
.map-wrap{padding:10px 14px;max-width:800px;margin:0 auto}
.map-filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.map-filters::-webkit-scrollbar{display:none}
.m-tab{padding:6px 12px;border-radius:20px;border:1px solid var(--border-color);background:var(--bg-card);font-size:12.5px;font-weight:800;color:var(--text-sub);white-space:nowrap;cursor:pointer}
.m-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}

.color-legend{display:flex;flex-wrap:wrap;gap:6px;background:var(--bg-card);padding:9px 11px;border-radius:12px;border:1px solid var(--border-color);margin-bottom:10px;font-size:12px;font-weight:700}
.c-chip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:6px;background:var(--bg-stop);cursor:pointer;border:1.5px solid transparent}
.c-chip.selected{border-color:var(--text-main);transform:scale(1.03)}
.c-line{width:14px;height:5px;border-radius:3px;display:inline-block}

#map{width:100%;height:62vh;min-height:420px;border-radius:16px;border:1.5px solid var(--border-color);box-shadow:var(--card-shadow);z-index:1}
.map-status{font-size:11.5px;color:var(--text-muted);margin-top:6px;text-align:right;font-weight:600}
.hidden{display:none!important}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <h1>🚌 순천 직통 노선 가이드</h1>
    <button class="dark-toggle" id="darkToggle">🌙 다크모드</button>
  </div>
  
  <div class="mode-switch">
    <button class="mode-btn active" id="btnModeSearch">🔍 노선 검색</button>
    <button class="mode-btn" id="btnModeMap">🗺️ 실제 노선 지도</button>
  </div>

  <div id="searchControls">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="경유지(예: 선평, 율촌) 또는 번호 검색" autocomplete="off" />
      <button class="clear-btn" id="clearBtn">✕</button>
    </div>
    <div class="tabs" id="tabContainer">
      <button class="tab active" data-group="ALL">전체</button>
      <button class="tab" data-group="60번대">60번대</button>
      <button class="tab" data-group="80번대">80번대</button>
      <button class="tab" data-group="90·20번대">90·20번대</button>
      <button class="tab" data-group="50번대">50번대</button>
      <button class="tab" data-group="70번대">70번대</button>
    </div>
    <div class="quick-nums" id="quickNums"></div>
  </div>
</div>

<!-- 1. 노선 검색 화면 -->
<div class="container" id="viewSearch">
  <div class="legend">
    <span class="legend-item"><i class="dot origin"></i>기점(출발)</span>
    <span class="legend-item"><i class="dot end"></i>회차지(종점)</span>
    <span class="legend-item"><i class="dot imp"></i>주의·분기 구간</span>
  </div>
  <div class="count" id="resultCount">총 0개 노선</div>
  <div id="routeList"></div>
</div>

<!-- 2. 실제 도로 기반 색상 분기 지도 -->
<div class="map-wrap hidden" id="viewMap">
  <div class="map-filters" id="mapFilters">
    <button class="m-tab active" data-mgroup="ALL">전체 노선망</button>
    <button class="m-tab" data-mgroup="90·20번대">90·20번대 (율촌·해룡)</button>
    <button class="m-tab" data-mgroup="연동축">60·80번대 (청암·연동·별량)</button>
    <button class="m-tab" data-mgroup="승주축">60번대 (승주·송광사)</button>
    <button class="m-tab" data-mgroup="시내광양">50·70번대 (시내·광양)</button>
  </div>
  <div class="color-legend" id="mapLegend"></div>
  <div id="map"></div>
  <div class="map-status" id="mapStatus">지도 위 동그라미(분기점)를 터치하면 상세 방향이 표시됩니다.</div>
</div>

let renderedLayers = [];
const routeCache = {};

function updateTileTheme() {
  if (!leafletMap) return;
  if (tileLayer) leafletMap.removeLayer(tileLayer);
  const isDark = document.body.classList.contains("dark");
  const url = isDark
    ? "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png"
    : "https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png";
  tileLayer = L.tileLayer(url, {
    attribution: '&copy; OpenStreetMap &copy; CARTO',
    maxZoom: 18
  }).addTo(leafletMap);
}

async function fetchRoadGeometry(seg) {
  if (routeCache[seg.id]) return routeCache[seg.id];
  const coordsStr = seg.pts.map(k => `${PTS[k][1]},${PTS[k][0]}`).join(";");
  try {
    const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${coordsStr}?overview=full&geometries=geojson`);
    const data = await res.json();
    if (data.routes && data.routes[0]) {
      const latlngs = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
      routeCache[seg.id] = latlngs;
      return latlngs;
    }
  } catch (e) {}
  return seg.pts.map(k => [PTS[k][0], PTS[k][1]]);
}

async function drawMapLayers() {
  if (!leafletMap) return;
  renderedLayers.forEach(l => leafletMap.removeLayer(l));
  renderedLayers = [];

  const targetSegs = mapSegments.filter(s => activeMapGroup === "ALL" || s.mgroup === activeMapGroup);
  
  // 범례 칩 렌더링
  const legendEl = document.getElementById("mapLegend");
  legendEl.innerHTML = targetSegs.map(s => `
    <span class="c-chip ${selectedSegmentId === s.id ? "selected" : ""}" data-seg="${s.id}">
      <i class="c-line" style="background:${s.color}"></i>${s.label}
    </span>
  `).join("");

  document.querySelectorAll(".c-chip").forEach(chip => {
    chip.addEventListener("click", () => {
      const id = chip.dataset.seg;
      selectedSegmentId = selectedSegmentId === id ? null : id;
      drawMapLayers();
    });
  });

  const usedPts = new Set();
  const bounds = [];

  for (const seg of targetSegs) {
    const isDimmed = selectedSegmentId && selectedSegmentId !== seg.id;
    const latlngs = await fetchRoadGeometry(seg);
    latlngs.forEach(ll => bounds.push(ll));
    seg.pts.forEach(p => usedPts.add(p));

    const poly = L.polyline(latlngs, {
      color: seg.color,
      weight: isDimmed ? 3 : seg.weight,
      opacity: isDimmed ? 0.25 : 0.9
    }).addTo(leafletMap);
    poly.bindPopup(`<b>${seg.label}</b>`);
    renderedLayers.push(poly);
  }

  // 주요 분기점 마커 찍기
  usedPts.forEach(k => {
    const [lat, lng, title] = PTS[k];
    const isHub = title.includes("분기") || title.includes("기점");
    const marker = L.circleMarker([lat, lng], {
      radius: isHub ? 7 : 5,
      fillColor: isHub ? "#ffd43b" : "#ffffff",
      color: "#191f28",
      weight: 2,
      fillOpacity: 1
    }).addTo(leafletMap);
    marker.bindPopup(`<b>${title}</b>`);
    renderedLayers.push(marker);
  });

  if (bounds.length > 0 && !selectedSegmentId) {
    leafletMap.fitBounds(bounds, { padding: [25, 25] });
  }
}

function initMap() {
  if (mapInitialized) {
    setTimeout(() => leafletMap.invalidateSize(), 100);
    return;
  }
  leafletMap = L.map("map").setView([34.93, 127.49], 11);
  updateTileTheme();
  mapInitialized = true;
  drawMapLayers();
}

function renderQuickButtons(){
  const e=routes.filter(e=>"ALL"===currentGroup||e.group===currentGroup);
  quickNumsContainer.innerHTML=e.map(e=>`<button class="q-btn ${selectedQuickNum===e.num?"active":""}" data-num="${e.num}">${e.num}</button>`).join("");
  document.querySelectorAll(".q-btn").forEach(e=>{
    e.addEventListener("click",()=>{
      const t=e.dataset.num;
      selectedQuickNum=selectedQuickNum===t?null:(searchInput.value="",t);
      renderQuickButtons();render();
    });
  });
}

function render(){
  const e=searchInput.value.trim().toLowerCase();
  clearBtn.style.display=e?"flex":"none";
  const t=routes.filter(t=>("ALL"===currentGroup||t.group===currentGroup)&&(selectedQuickNum?t.num===selectedQuickNum:!e||t.num.toLowerCase().includes(e)||t.stops.some(t=>t.name.toLowerCase().includes(e))||(t.note?t.note.toLowerCase().includes(e):!1)));
  resultCount.textContent=selectedQuickNum?`${selectedQuickNum}번 노선 선택됨 (버튼 재터치 시 전체보기)`:`표시 노선: ${t.length}개`;
  routeList.innerHTML="";
  t.forEach(t=>{
    const n=document.createElement("div");n.className="card";
    const r=t.stops.map((n,r)=>{
      const o=0===r,a=r===t.stops.length-1,s=e&&n.name.toLowerCase().includes(e);
      let c="",l="";
      if(o){c="origin";l='<span class="badge-tag">기점</span>'}
      else if(a){c="end";l='<span class="badge-tag">회차</span>'}
      else if(n.important){c="important"}
      return`<span class="stop ${c} ${s?"highlight":""}">${l}${n.name}</span>${a?"":'<span class="arrow">▶</span>'}`;
    }).join("");
    const o=t.note?`<div class="note">${t.note}</div>`:"";
    n.innerHTML=`<div class="card-header"><div class="title-wrap"><span class="bus-num">${t.num}번</span></div><span class="group-badge">${t.group}</span></div><div class="route-flow">${r}</div>${o}`;
    routeList.appendChild(n);
  });
}

searchInput.addEventListener("input",()=>{selectedQuickNum=null;renderQuickButtons();render()});
clearBtn.addEventListener("click",()=>{searchInput.value="";searchInput.focus();render()});
tabs.forEach(e=>{
  e.addEventListener("click",()=>{
    tabs.forEach(e=>e.classList.remove("active"));e.classList.add("active");
    currentGroup=e.dataset.group;selectedQuickNum=null;renderQuickButtons();render();
  });
});
renderQuickButtons();render();
