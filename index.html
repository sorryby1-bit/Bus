<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>순천 버스 노선 가이드</title>
<style>
:root{
  --bg-body:#101318;--bg-header:#191d24;--bg-card:#1e232b;--bg-input:#262c36;--bg-stop:#2a303c;
  --text-main:#f2f4f6;--text-sub:#b0b8c1;--text-muted:#76808f;--border-color:#2f3642;
  --primary:#4593fc;--primary-light:#1e324d;--primary-text:#74b2ff;
  --shadow:0 2px 10px rgba(0,0,0,.45);--card-shadow:0 2px 6px rgba(0,0,0,.28);
  --origin-bg:#0c382c;--origin-text:#63e6be;--origin-border:#12b886;
  --end-bg:#133252;--end-text:#74c0fc;--end-border:#339af0;
  --imp-bg:#45181c;--imp-text:#ff8787;--imp-border:#fa5252;
  --time-bg:#2b2615;--time-text:#ffd43b;--time-border:#fcc419;
  --x-bg:#2c2f36;--x-text:#adb5bd;--x-border:#495057;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
body{background-color:var(--bg-body);color:var(--text-main);padding-bottom:44px}
.header{position:sticky;top:0;background:var(--bg-header);padding:12px 16px 10px;box-shadow:var(--shadow);z-index:100;border-bottom:1px solid var(--border-color)}
.header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.header h1{font-size:18px;font-weight:900;color:var(--text-main);letter-spacing:-.3px}
.sub-badge{font-size:11.5px;background:var(--primary-light);color:var(--primary-text);padding:4px 9px;border-radius:12px;font-weight:800}

/* 2단 메인 메뉴 */
.main-menu{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg-stop);padding:4px;border-radius:12px;margin-bottom:10px}
.menu-btn{padding:9px 0;border:none;border-radius:9px;background:transparent;color:var(--text-sub);font-size:14.5px;font-weight:800;cursor:pointer;transition:.15s}
.menu-btn.active{background:var(--bg-card);color:var(--primary);box-shadow:0 1px 4px rgba(0,0,0,.35)}

.search-box{position:relative;display:flex;align-items:center}
.search-box input{width:100%;padding:10px 38px 10px 14px;font-size:16px;border:2px solid var(--primary);border-radius:12px;outline:none;background:var(--bg-input);color:var(--text-main)}
.search-box input::placeholder{color:var(--text-muted);font-size:14.5px}
.clear-btn{position:absolute;right:10px;background:var(--text-muted);color:var(--bg-header);border:none;border-radius:50%;width:22px;height:22px;font-size:13px;font-weight:800;cursor:pointer;display:none;align-items:center;justify-content:center}

.tabs{display:flex;gap:6px;overflow-x:auto;padding-top:9px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:6px 12px;border-radius:20px;border:1px solid var(--border-color);background:var(--bg-card);font-size:13px;font-weight:700;color:var(--text-sub);white-space:nowrap;cursor:pointer}
.tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}

.quick-nums{display:flex;gap:6px;overflow-x:auto;padding-top:8px;margin-top:8px;border-top:1px dashed var(--border-color);scrollbar-width:none}
.quick-nums::-webkit-scrollbar{display:none}
.q-btn{padding:5px 11px;border-radius:8px;border:1px solid var(--border-color);background:var(--bg-stop);color:var(--text-main);font-size:14px;font-weight:800;white-space:nowrap;cursor:pointer}
.q-btn.active{background:#ff922b;color:#111;border-color:#ff922b}
.q-btn.is-x{color:var(--text-muted);border-style:dashed}

.container{padding:14px 16px;max-width:640px;margin:0 auto}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--text-sub);margin-bottom:10px;align-items:center}
.legend-item{display:flex;align-items:center;gap:4px;font-weight:600}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.dot.origin{background:var(--origin-border)}
.dot.end{background:var(--end-border)}
.dot.imp{background:var(--imp-border)}
.dot.time{background:var(--time-border)}

.filter-banner{display:flex;justify-content:space-between;align-items:center;background:var(--primary-light);border:1px solid var(--primary);color:var(--primary-text);padding:8px 12px;border-radius:10px;margin-bottom:10px;font-size:13px;font-weight:800}
.filter-banner button{background:var(--primary);color:#fff;border:none;padding:3px 9px;border-radius:6px;font-size:12px;font-weight:800;cursor:pointer}

.count{font-size:13px;color:var(--text-muted);margin-bottom:10px;font-weight:600}

.card{background:var(--bg-card);border-radius:14px;padding:15px;margin-bottom:12px;box-shadow:var(--card-shadow);border:1px solid var(--border-color)}
.card.card-x{opacity:.82}
.card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:10px}
.title-left{display:flex;flex-direction:column;gap:3px}
.num-row{display:flex;align-items:center;gap:8px}
.bus-num{font-size:22px;font-weight:900;color:var(--primary);letter-spacing:-.5px}
.dest-title{font-size:14px;font-weight:800;color:var(--text-main)}
.group-badge{font-size:11.5px;background:var(--bg-stop);color:var(--text-sub);padding:4px 8px;border-radius:6px;font-weight:700;white-space:nowrap}

/* 직통시간 & 소요시간 뱃지 */
.time-bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px}
.time-chip{font-size:12.5px;font-weight:800;padding:4px 9px;border-radius:7px;background:var(--time-bg);color:var(--time-text);border:1px solid var(--time-border)}
.time-chip.dur{background:var(--bg-stop);color:var(--text-main);border:1px solid var(--border-color)}
.time-chip.no-direct{background:var(--x-bg);color:var(--x-text);border:1px solid var(--x-border)}

.route-flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14px;line-height:1.5;color:var(--text-main)}
.stop{background:var(--bg-stop);padding:5px 9px;border-radius:7px;font-weight:600;border:1px solid transparent;cursor:pointer;transition:transform .1s}
.stop:active{transform:scale(.96)}
.stop.origin{background:var(--origin-bg);color:var(--origin-text);border:1.5px solid var(--origin-border);font-weight:800}
.stop.end{background:var(--end-bg);color:var(--end-text);border:1.5px solid var(--end-border);font-weight:800}
.stop.important{background:var(--imp-bg);color:var(--imp-text);border:1.5px solid var(--imp-border);font-weight:800}
.badge-tag{font-size:10px;padding:1px 4px;border-radius:4px;margin-right:4px;vertical-align:middle;font-weight:900}
.origin .badge-tag{background:var(--origin-border);color:#000}
.end .badge-tag{background:var(--end-border);color:#000}
.stop.highlight{background:#ffd43b!important;font-weight:900!important;color:#111!important;border:1.5px solid #f59f00!important}
.arrow{color:var(--text-muted);font-size:11px;font-weight:700}

.note{margin-top:11px;padding:8px 11px;background:var(--imp-bg);color:var(--imp-text);border:1px solid var(--imp-border);border-radius:8px;font-size:13px;font-weight:700;line-height:1.45}

/* 2. 버스노선 준비 화면 */
.empty-box{background:var(--bg-card);border:1.5px dashed var(--border-color);border-radius:16px;padding:36px 20px;text-align:center;margin-top:10px}
.empty-box h2{font-size:17px;font-weight:800;margin-bottom:8px;color:var(--text-main)}
.empty-box p{font-size:13.5px;color:var(--text-sub);line-height:1.6}
.hidden{display:none!important}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <h1>🚌 순천 버스 노선 가이드</h1>
    <span class="sub-badge">순천교통 기준</span>
  </div>
  
  <div class="main-menu">
    <button class="menu-btn active" id="btnMenuDirect">1. 직통</button>
    <button class="menu-btn" id="btnMenuNormal">2. 버스노선</button>
  </div>

  <div id="directControls">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="번호, 방면, 경유지, 초성(예: ㅅㅍ, ㅇㅊ) 검색" autocomplete="off" />
      <button class="clear-btn" id="clearBtn">✕</button>
    </div>
    <div class="tabs" id="tabContainer">
      <button class="tab active" data-group="ALL">전체</button>
      <button class="tab" data-group="20번대">20번대</button>
      <button class="tab" data-group="50번대">50번대</button>

      <button class="tab" data-group="90번대">90번대</button>
      <button class="tab" data-group="100번대">100번대</button>
    </div>
    <div class="quick-nums" id="quickNums"></div>
  </div>
</div>

<!-- 1. 직통 화면 -->
<div class="container" id="viewDirect">
  <div class="legend">

    <span class="legend-item"><i class="dot end"></i>직통발</span>
    <span class="legend-item"><i class="dot imp"></i>주의·분기</span>
  </div>
  <div id="stopFilterBanner" class="filter-banner hidden">
    <span id="stopFilterText">정류장 필터 적용됨</span>
    <button id="clearStopFilter">해제 ✕</button>
  </div>
  <div class="count" id="resultCount">총 0개 노선</div>
  <div id="routeList"></div>
</div>

<!-- 2. 버스노선 화면 (추후 일반 노선 데이터 추가 공간) -->

</div>

// 2. 일반 버스노선 데이터 (추후 추가용)
const normalRoutes = [];

const searchInput = document.getElementById("searchInput"),
      clearBtn = document.getElementById("clearBtn"),
      routeList = document.getElementById("routeList"),
      resultCount = document.getElementById("resultCount"),
      tabs = document.querySelectorAll(".tab"),
      quickNumsContainer = document.getElementById("quickNums"),
      btnMenuDirect = document.getElementById("btnMenuDirect"),
      btnMenuNormal = document.getElementById("btnMenuNormal"),
      directControls = document.getElementById("directControls"),
      viewDirect = document.getElementById("viewDirect"),
      viewNormal = document.getElementById("viewNormal"),
      stopFilterBanner = document.getElementById("stopFilterBanner"),
      stopFilterText = document.getElementById("stopFilterText"),
      clearStopFilter = document.getElementById("clearStopFilter");

let currentGroup = "ALL",
    selectedQuickNum = null,
    selectedStopFilter = null;

// 초성 추출 함수
const CHO = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
function getChosung(str) {
  let res = "";
  for (let i = 0; i < str.length; i++) {
    const code = str.charCodeAt(i) - 44032;
    if (code >= 0 && code <= 11171) res += CHO[Math.floor(code / 588)];
    else res += str[i];
  }
  return res;
}

function matchQuery(target, query) {
  if (!query) return true;
  const t = target.toLowerCase();
  const q = query.toLowerCase();
  if (t.includes(q)) return true;
  if (/^[ㄱ-ㅎ\s]+$/.test(q)) {
    return getChosung(t).includes(q.replace(/\s+/g, ""));
  }
  return false;
}

// 2단 메인 메뉴 전환
btnMenuDirect.addEventListener("click", () => {
  btnMenuDirect.classList.add("active");
  btnMenuNormal.classList.remove("active");
  directControls.classList.remove("hidden");
  viewDirect.classList.remove("hidden");
  viewNormal.classList.add("hidden");
});

btnMenuNormal.addEventListener("click", () => {
  btnMenuNormal.classList.add("active");
  btnMenuDirect.classList.remove("active");
  directControls.classList.add("hidden");
  viewDirect.classList.add("hidden");
  viewNormal.classList.remove("hidden");
});

function renderQuickButtons() {
  const list = directRoutes.filter(r => currentGroup === "ALL" || r.group === currentGroup);
  quickNumsContainer.innerHTML = list.map(r => `
    <button class="q-btn ${selectedQuickNum === r.num ? "active" : ""} ${r.directTime === "X" ? "is-x" : ""}" data-num="${r.num}">
      ${r.num}${r.directTime === "X" ? "(X)" : ""}
    </button>
  `).join("");

  document.querySelectorAll(".q-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const n = btn.dataset.num;
      selectedStopFilter = null;
      if (selectedQuickNum === n) {
        selectedQuickNum = null;
      } else {
        searchInput.value = "";
        selectedQuickNum = n;
      }
      renderQuickButtons();
      render();
    });
  });
}

function render() {
  const q = searchInput.value.trim();
  clearBtn.style.display = q ? "flex" : "none";

  if (selectedStopFilter) {
    stopFilterBanner.classList.remove("hidden");
    stopFilterText.textContent = `📍 '${selectedStopFilter}' 경유 노선 모아보기`;
  } else {
    stopFilterBanner.classList.add("hidden");
  }

  const filtered = directRoutes.filter(r => {
    const groupOk = currentGroup === "ALL" || r.group === currentGroup;
    if (!groupOk) return false;
    if (selectedQuickNum) return r.num === selectedQuickNum;
    if (selectedStopFilter) {
      return r.stops.some(s => s.name.includes(selectedStopFilter));
    }
    if (!q) return true;
    return (
      matchQuery(r.num, q) ||
      matchQuery(r.dest, q) ||
      matchQuery(r.directTime, q) ||
      matchQuery(r.note, q) ||
      r.stops.some(s => matchQuery(s.name, q))
    );
  });

  if (selectedQuickNum) {
    resultCount.textContent = `${selectedQuickNum}번 노선 선택됨 (버튼 재터치 시 전체보기)`;
  } else {
    resultCount.textContent = `표시 노선: ${filtered.length}개 (전체 ${directRoutes.length}개)`;
  }

  routeList.innerHTML = "";
  filtered.forEach(r => {
    const isX = r.directTime === "X";
    const card = document.createElement("div");
    card.className = `card ${isX ? "card-x" : ""}`;

    const timeHtml = isX
      ? `<span class="time-chip no-direct">직통시간: X (직통 없음)</span>`
      : `<span class="time-chip">⏰ 직통시간: ${r.directTime}</span><span class="time-chip dur">⏱️ 소요: ${r.duration}</span>`;

    const stopsHtml = r.stops.map((s, idx) => {
      const isFirst = idx === 0 && r.stops.length > 1;
      const isLast = idx === r.stops.length - 1;
      const isMatch = (q && matchQuery(s.name, q)) || (selectedStopFilter && s.name.includes(selectedStopFilter));

      let cls = "", tag = "";
      if (isFirst) {
        cls = "origin";
        tag = '<span class="badge-tag">기점</span>';
      } else if (isLast) {
        cls = "end";
        tag = '<span class="badge-tag">직통발</span>';
      } else if (s.important) {
        cls = "important";
      }

      const cleanStopName = s.name.split("(")[0].split("[")[0].trim();
      return `<span class="stop ${cls} ${isMatch ? "highlight" : ""}" data-stop="${cleanStopName}">${tag}${s.name}</span>${idx === r.stops.length - 1 ? "" : '<span class="arrow">▶</span>'}`;
    }).join("");

    const noteHtml = r.note ? `<div class="note">📌 ${r.note}</div>` : "";

    card.innerHTML = `
      <div class="card-header">
        <div class="title-left">
          <div class="num-row">
            <span class="bus-num">${r.num}번</span>
            <span class="dest-title">${r.dest}</span>
          </div>
        </div>
        <span class="group-badge">${r.group}</span>
      </div>
      <div class="time-bar">${timeHtml}</div>
      <div class="route-flow">${stopsHtml}</div>
      ${noteHtml}
    `;
    routeList.appendChild(card);
  });

  // 정류장 칩 클릭 시 해당 정류장 경유 노선 필터링
  document.querySelectorAll(".stop").forEach(el => {
    el.addEventListener("click", () => {
      const st = el.dataset.stop;
      if (!st) return;
      selectedQuickNum = null;
      searchInput.value = "";
      selectedStopFilter = selectedStopFilter === st ? null : st;
      renderQuickButtons();
      render();
    });
  });
}

clearStopFilter.addEventListener("click", () => {
  selectedStopFilter = null;
  render();
});

searchInput.addEventListener("input", () => {
  selectedQuickNum = null;
  selectedStopFilter = null;
  renderQuickButtons();
  render();
});

clearBtn.addEventListener("click", () => {
  searchInput.value = "";
  searchInput.focus();
  render();
});

tabs.forEach(tab => {
  tab.addEventListener("click", () => {
    tabs.forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    currentGroup = tab.dataset.group;
    selectedQuickNum = null;
    selectedStopFilter = null;
    renderQuickButtons();
    render();
  });
});

renderQuickButtons();
render();
</script>
