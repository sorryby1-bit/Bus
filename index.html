<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>순천 직통 노선 검색</title>
  <style>
    :root {
      --bg-body: #f2f4f7;
      --bg-header: #ffffff;
      --bg-card: #ffffff;
      --bg-input: #f9fafb;
      --bg-stop: #f2f4f6;
      --text-main: #191f28;
      --text-sub: #4e5968;
      --text-muted: #8b95a1;
      --border-color: #e5e8eb;
      --primary: #3182f6;
      --primary-light: #e8f3ff;
      --primary-text: #1b64da;
      --shadow: 0 2px 8px rgba(0,0,0,0.06);
      --card-shadow: 0 1px 4px rgba(0,0,0,0.04);
      
      /* 기점 / 회차지 / 주의구간 색상 (라이트) */
      --origin-bg: #e6fcf5;
      --origin-text: #087f5b;
      --origin-border: #63e6be;
      
      --end-bg: #e7f5ff;
      --end-text: #1864ab;
      --end-border: #4dabf7;
      
      --imp-bg: #fff0f0;
      --imp-text: #c92a2a;
      --imp-border: #ffa8a8;
    }

    body.dark {
      --bg-body: #101318;
      --bg-header: #191d24;
      --bg-card: #1e232b;
      --bg-input: #262c36;
      --bg-stop: #2a303c;
      --text-main: #f2f4f6;
      --text-sub: #b0b8c1;
      --text-muted: #76808f;
      --border-color: #2f3642;
      --primary: #4593fc;
      --primary-light: #1e324d;
      --primary-text: #74b2ff;
      --shadow: 0 2px 10px rgba(0,0,0,0.4);
      --card-shadow: 0 2px 6px rgba(0,0,0,0.25);

      /* 기점 / 회차지 / 주의구간 색상 (다크 - 고대비 가독성 최적화) */
      --origin-bg: #0c382c;
      --origin-text: #63e6be;
      --origin-border: #12b886;

      --end-bg: #133252;
      --end-text: #74c0fc;
      --end-border: #339af0;

      --imp-bg: #45181c;
      --imp-text: #ff8787;
      --imp-border: #fa5252;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    body { background-color: var(--bg-body); color: var(--text-main); padding-bottom: 40px; transition: background-color 0.2s, color 0.2s; }
    
    .header { position: sticky; top: 0; background: var(--bg-header); padding: 14px 16px; box-shadow: var(--shadow); z-index: 100; border-bottom: 1px solid var(--border-color); }
    .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .header h1 { font-size: 18px; font-weight: 800; color: var(--text-main); }
    
    .dark-toggle { background: var(--bg-stop); color: var(--text-main); border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 4px; }
    
    .search-box { position: relative; display: flex; align-items: center; }
    .search-box input { width: 100%; padding: 11px 38px 11px 14px; font-size: 16px; border: 2px solid var(--primary); border-radius: 12px; outline: none; background: var(--bg-input); color: var(--text-main); }
    .search-box input::placeholder { color: var(--text-muted); }
    .clear-btn { position: absolute; right: 10px; background: var(--text-muted); color: var(--bg-header); border: none; border-radius: 50%; width: 22px; height: 22px; font-size: 13px; font-weight: bold; cursor: pointer; display: none; align-items: center; justify-content: center; }
    
    .tabs { display: flex; gap: 6px; overflow-x: auto; padding-top: 10px; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border-color); background: var(--bg-card); font-size: 13px; font-weight: 700; color: var(--text-sub); white-space: nowrap; cursor: pointer; }
    .tab.active { background: var(--primary); color: #ffffff; border-color: var(--primary); }

    /* 노선 번호 퀵 버튼 영역 */
    .quick-nums { display: flex; gap: 6px; overflow-x: auto; padding-top: 8px; margin-top: 8px; border-top: 1px dashed var(--border-color); scrollbar-width: none; }
    .quick-nums::-webkit-scrollbar { display: none; }
